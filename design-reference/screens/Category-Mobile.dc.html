<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Varnika Sarees · Silk sarees (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f4ef}
a{color:#8e4f4e}a:hover{color:#7a3c40}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #7a3c40;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; font-family: 'DM Sans', system-ui, sans-serif; color: #55433d; background: #f8f4ef">

<header style="background: #f8f4ef; border-bottom: 1px solid #d8c7ae; padding: 8px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 60px; height: 56px; background: transparent; border: 0; color: #55433d; font: 500 12px 'DM Sans', sans-serif">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Menu</button>
    <a href="Mobile-Home.dc.html" aria-label="Varnika Sarees home" style="display: flex; align-items: center; height: 48px; border-radius: 2px"><img src="/images/logo.png" alt="Varnika, where tradition meets timeless style" style="height: 48px; width: auto; display: block"></a>
    <div style="display: flex">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 60px; height: 56px; color: #55433d; text-decoration: none; font-size: 12px; font-weight: 500">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
      <a href="Cart.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 56px; height: 56px; color: #55433d; text-decoration: none; font-size: 12px; font-weight: 500">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Cart (2)</a>
    </div>
  </div>
</header>

<div style="padding: 16px 16px 8px">
  <nav aria-label="Breadcrumb" style="font-size: 14px; color: #72625a"><a href="Mobile-Home.dc.html">Home</a> / Silk sarees</nav>
  <h1 style="margin: 12px 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 1.1">Silk sarees</h1>
  <p style="margin: 0; font-size: 16px; line-height: 1.6">Kanjivaram, Banarasi, Paithani, Chanderi and Tussar.</p>
</div>

<!-- Sticky filter/sort bar -->
<div style="position: sticky; top: 0; z-index: 100; background: #f8f4ef; border-bottom: 1px solid #d8c7ae; padding: 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
  <a href="Filters-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: #ffffff; border: 1px solid #8a7b70; border-radius: 4px; color: #55433d; text-decoration: none; font-size: 15px; font-weight: 600">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
    Filters
  </a>
  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; background: #ffffff; border: 1px solid #8a7b70; border-radius: 4px; color: #55433d; font: 600 15px 'DM Sans', sans-serif">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M4 15l4 4 4-4M16 19V5M12 9l4-4 4 4"></path></svg>
    Sort: Newest
  </button>
</div>

<div style="padding: 16px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
  <span style="font-size: 15px"><strong style="font-weight: 600">9</strong> sarees</span>
</div>

<section aria-label="Products" style="padding: 24px 16px 48px">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
      <a href="Product.dc.html" style="display: flex; flex-direction: column; color: #55433d; text-decoration: none">
        <div style="position: relative; aspect-ratio: 3 / 4; background: #f3ece4; border-radius: 2px; overflow: hidden">
          <img src="{{p.img}}" alt="{{p.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}}">
          <sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 8px; left: 8px; padding: 3px 8px; background: {{p.badgeBg}}; color: #55433d; font-size: 13px; font-weight: 600; border-radius: 2px">{{p.badge}}</span>
          </sc-if>
        </div>
        <span style="padding-top: 12px; font-size: 16px; line-height: 1.4; font-weight: 500">{{p.name}}</span>
        <span style="padding-top: 6px; font-size: 17px; line-height: 1.3; font-weight: 500">{{p.price}}</span>
        <span style="padding-top: 4px; font-size: 14px; color: {{p.stockColor}}">{{p.stock}}</span>
      </a>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding-top: 40px; text-align: center">
    <span style="font-size: 14px; color: #72625a">Cannot find what you are looking for?</span>
    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 1px solid #8a7b70; border-radius: 4px; color: #55433d; text-decoration: none; font-size: 15px; font-weight: 600; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19l-4 1z"></path></svg>
      Ask us on WhatsApp
    </a>
  </div>
</section>

<footer style="background: #f3ece4; border-top: 1px solid #d8c7ae; padding: 24px 16px; font-size: 13px; color: #72625a">© 2026 Varnika Sarees · [PHONE NUMBER]</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = '#4a6646', warn = '#7f5413';
    return {
      products: [
        { name: 'Red Kanjivaram silk saree', price: '₹18,500', stock: 'In stock', stockColor: ok, badge: 'New arrival', badgeBg: '#b5b9a2', img: '/images/red-kanjivaram.jpg', alt: 'Red Kanjivaram silk saree with a broad gold zari border, worn and draped', pos: '50% 50%' },
        { name: 'Emerald Kanjivaram silk saree', price: '₹21,000', stock: 'In stock', stockColor: ok, badge: '', badgeBg: '', img: '/images/emerald-kanjivaram.jpg', alt: 'Emerald Kanjivaram silk saree with a gold paisley border, worn and draped', pos: '50% 50%' },
        { name: 'Magenta Banarasi silk saree', price: '₹14,200', stock: 'Only 2 left', stockColor: warn, badge: '', badgeBg: '', img: '/images/magenta-banarasi.jpg', alt: 'Magenta Banarasi silk saree with gold brocade, worn and draped', pos: '62% 50%' },
        { name: 'Navy Banarasi silk saree', price: '₹16,750', stock: 'Only 1 left', stockColor: warn, badge: '', badgeBg: '', img: '/images/navy-banarasi.jpg', alt: 'Navy Banarasi silk saree with gold butti weave, worn and draped', pos: '50% 50%' },
        { name: 'Purple Paithani silk saree', price: '₹19,800', stock: 'Only 2 left', stockColor: warn, badge: 'Featured', badgeBg: '#d8b8af', img: '/images/purple-paithani.jpg', alt: 'Purple Paithani silk saree with a gold peacock pallu, worn and draped', pos: '50% 50%' },
        { name: 'Sage green soft silk saree', price: '₹9,800', stock: 'In stock', stockColor: ok, badge: '', badgeBg: '', img: '/images/sage-soft-silk.jpg', alt: 'Sage green soft silk saree with fine zari jaal, worn and draped', pos: '50% 50%' }
      ]
    };
  }
}
</script>
</body>
</html>
